<text x="618" y="70" text-anchor="end" class="k">Dangers</text><text x="618" y="94" text-anchor="end" class="k">potentiels</text><text x="20" y="339" class="k">Accident</text><text x="20" y="36" class="n">Certains trous sont des défaillances actives (erreurs du moment),</text><text x="20" y="58" class="n">d’autres des défaillances latentes (failles cachées).</text>
<text x="20" y="366" class="s">D’après J. Reason, Organizational Accidents Revisited, 2016.</text></svg>