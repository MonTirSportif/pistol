<text x="668" y="149" text-anchor="end" class="k">Un coup</text><text x="668" y="173" text-anchor="end" class="k">non voulu</text><text x="20" y="308" class="k">Un blessé</text><text x="20" y="30" class="n">Au stand, chaque règle est une tranche : si l’une a une faille,</text><text x="20" y="51" class="n">la suivante arrête le coup. L’accident exige qu’elles échouent toutes.</text><text x="145" y="358" text-anchor="middle" class="l">Drapeau</text><text x="145" y="378" text-anchor="middle" class="s">arme en sécurité</text><text x="265" y="358" text-anchor="middle" class="l">Canon</text><text x="265" y="378" text-anchor="middle" class="s">vers les cibles</text><text x="385" y="358" text-anchor="middle" class="l">Index</text><text x="385" y="378" text-anchor="middle" class="s">hors de la détente</text><text x="505" y="358" text-anchor="middle" class="l">Responsable</text><text x="505" y="378" text-anchor="middle" class="s">de tir vigilant</text>
<text x="20" y="406" class="s">Le modèle de J. Reason appliqué au tir sportif.</text></svg>