<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="t d">
<title id="t">Le fromage suisse au stand de tir</title><desc id="d">Au stand, quatre barrières se suivent : arme mise en sécurité avec drapeau, canon toujours vers les cibles, index hors de la détente, et vigilance du responsable de tir. Le coup accidentel n’arrive que si toutes échouent.</desc>
